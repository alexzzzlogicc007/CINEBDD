<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CinéExplorer{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">
            🎬 CinéExplorer
        </a>

        <!-- Toggle mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <!-- Liens -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/movies/">Films</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/stats/">Statistiques</a>
                </li>
            </ul>

            <!-- Recherche -->
            <form class="d-flex" action="/search/" method="get">
                <input
                    class="form-control me-2"
                    type="search"
                    name="q"
                    placeholder="Rechercher un film ou une personne"
                    required
                >
                <button class="btn btn-outline-light" type="submit">
                    🔍
                </button>
            </form>

        </div>
    </div>
</nav>

<!-- CONTENU -->
<div class="container mb-5">

    <!-- Messages utilisateur -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="bg-dark text-light text-center py-3 mt-auto">
    <small>
        CinéExplorer — Projet bases de données · Django · SQLite · MongoDB
    </small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
